name: Application pull-request validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Check repository content
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject prohibited tracked files
        shell: bash
        run: |
          prohibited_files="$(
            git ls-files |
            grep --extended-regexp \
              '(^|/)(__pycache__|\.pytest_cache|\.test-venv|node_modules)(/|$)|\.py[co]$|(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.tfstate($|\.)|\.tfplan$' ||
            true
          )"

          if [ -n "$prohibited_files" ]; then
            echo "ERROR: Prohibited generated or sensitive files are tracked:"
            printf '%s\n' "$prohibited_files"
            exit 1
          fi

          echo "OK: No prohibited generated or sensitive files are tracked."

      - name: Scan tracked content for common credential patterns
        shell: bash
        run: |
          aws_key_prefix="AK""IA"
          aws_secret_name="aws_secret""_access_key"
          long_github_token_marker="github""_pat_"
          github_token_prefix="gh""p_"
          private_key_marker="BEGIN (RSA |EC |OPENSSH )?PRIVATE"" KEY"

          credential_pattern="${aws_key_prefix}[0-9A-Z]{16}|${aws_secret_name}|${long_github_token_marker}[A-Za-z0-9_]+|${github_token_prefix}[A-Za-z0-9]+|${private_key_marker}"

          if git grep \
            --line-number \
            --extended-regexp \
            "$credential_pattern"
          then
            echo "ERROR: Review the possible credentials shown above."
            exit 1
          fi

          echo "OK: No common credential patterns found in tracked content."

  backend-tests:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install \
            --requirement backend/requirements.txt \
            --requirement backend/requirements-dev.txt

      - name: Compile backend source
        run: |
          python -m py_compile \
            backend/app.py \
            backend/migrate.py

      - name: Run backend tests
        run: python -m pytest backend/tests

  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

  container-validation:
    name: Build and scan ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs:
      - repository-security
      - backend-tests
      - compose-validation

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: backend/Dockerfile
            context: .
          - component: frontend
            dockerfile: frontend/Dockerfile
            context: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: three-tier-${{ matrix.component }}:pr-${{ github.event.pull_request.number }}

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: three-tier-${{ matrix.component }}:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          image: three-tier-${{ matrix.component }}:pr-${{ github.event.pull_request.number }}
          format: cyclonedx-json
          output-file: ${{ matrix.component }}-sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.component }}-sbom
          path: ${{ matrix.component }}-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14